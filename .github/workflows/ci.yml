name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 비밀키 없이 돈다(검증함): 빌드 시점에 DB·네트워크 접속이 없고, 내용 페이지는 요청 때 그려진다.
    # DB 테스트(tests/queries.test.ts)는 NEXT_PUBLIC_SUPABASE_URL 이 없으면 스스로 건너뛴다.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx next build
