<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5e8c">
<meta name="robots" content="noindex">
<title>양양생활 · 인터넷 연결 없음 / You're offline</title>
<!--
  서비스 워커(public/sw.js)가 페이지 이동에 실패했을 때만 보여 주는 정적 안내 화면.
  네트워크 없이 떠야 하므로 글꼴·CSS·스크립트를 밖에서 불러오지 않는다.
  색은 src/app/globals.css 토큰과 같은 값만 쓴다:
  sea #0f5e8c · sea-strong #0a4669 · sea-soft #e6f1f8 · on-sea #ffffff · sand #f7f3ec · surface #ffffff · ink #1d2328 · muted #5f6b75 · line #e2ddd3
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 16px;
    background: #f7f3ec; color: #1d2328;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 16px; font-weight: 400; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 420px; padding: 28px 24px;
    background: #ffffff; border: 1px solid #e2ddd3; border-radius: 16px; text-align: center;
  }
  .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 16px; background: #0f5e8c; color: #ffffff;
  }
  .brand { margin: 12px 0 0; font-weight: 700; color: #0f5e8c; }
  section { margin-top: 20px; }
  section + section { padding-top: 20px; border-top: 1px solid #e2ddd3; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4; }
  p { margin: 6px 0 0; }
  .sub { color: #5f6b75; font-size: 15px; }
  button {
    display: flex; align-items: center; justify-content: center; width: 100%;
    min-height: 48px; margin-top: 24px; padding: 0 16px;
    border: 0; border-radius: 12px; background: #0f5e8c; color: #ffffff;
    font: inherit; font-weight: 500; cursor: pointer;
  }
  button:hover, button:active { background: #0a4669; }
  button:focus-visible { outline: 3px solid #0f5e8c; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
      <path d="M2.75 9.5c1.6 0 2.4-1.5 4.6-1.5s3 1.5 4.65 1.5 2.45-1.5 4.65-1.5 3 1.5 4.6 1.5" />
      <path d="M2.75 14c1.6 0 2.4-1.5 4.6-1.5s3 1.5 4.65 1.5 2.45-1.5 4.65-1.5 3 1.5 4.6 1.5" />
      <path d="M2.75 18.5c1.6 0 2.4-1.5 4.6-1.5s3 1.5 4.65 1.5 2.45-1.5 4.65-1.5 3 1.5 4.6 1.5" />
    </svg>
  </span>
  <p class="brand">양양생활 · YANGYANG LIFE</p>

  <section lang="ko">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>영업시간 같은 정보는 늘 최신으로 보여 드리려고 저장해 두지 않아요.</p>
    <p class="sub">와이파이나 데이터를 확인한 뒤 다시 시도해 주세요.</p>
  </section>

  <section lang="en">
    <h1>You're offline</h1>
    <p>We don't store pages on your phone, so opening hours are always up to date.</p>
    <p class="sub">Check your Wi-Fi or mobile data, then try again.</p>
  </section>

  <button type="button" id="retry">다시 시도 · Try again</button>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () {
    location.reload();
  });
  // 연결이 돌아오면 저절로 다시 불러온다
  window.addEventListener("online", function () {
    location.reload();
  });
</script>
</body>
</html>
